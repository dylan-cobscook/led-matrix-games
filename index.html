<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Page metadata tells the browser how to display this page. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matrix Portal Pixel Grid</title>
  <!-- CSS controls the full-screen canvas and the floating color-picker bar. -->
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    .toolbar {
      position: fixed;
      z-index: 1;
      top: 16px;
      left: 50%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      color: #fff;
      background: rgba(25, 25, 25, 0.9);
      border: 1px solid #555;
      border-radius: 999px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      font: 500 14px system-ui, sans-serif;
      transform: translateX(-50%);
    }
    .toolbar input { width: 36px; height: 28px; padding: 0; border: 0; background: none; cursor: pointer; }
    dialog {
      width: min(400px, calc(100% - 32px));
      padding: 24px;
      color: #fff;
      background: #191919;
      border: 1px solid #555;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      font: 500 14px system-ui, sans-serif;
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.7); }
    #name-form { display: grid; gap: 12px; }
    #name-form h1 { margin: 0; font-size: 20px; }
    #name-form input, #name-form button { padding: 10px; font: inherit; }
    #name-form button { cursor: pointer; }
  </style>
</head>
<body>
  <!-- The toolbar lets you choose a color for the next pixel you click. -->
  <header class="toolbar">
    <label for="pixel-color">Pixel color</label>
    <input id="pixel-color" type="color" value="#ffffff" aria-label="Choose pixel color">
  </header>
  <dialog id="name-dialog" aria-labelledby="name-title" closedby="none">
    <form id="name-form">
      <h1 id="name-title">Who is drawing?</h1>
      <label for="user-name">Enter your name to continue.</label>
      <input id="user-name" type="text" maxlength="32" autocomplete="name" required autofocus>
      <button type="submit">Continue</button>
    </form>
  </dialog>
  <!-- JavaScript draws the interactive LED grid inside this canvas. -->
  <canvas id="grid" aria-label="64 by 32 LED pixel grid"></canvas>
  <script src="/app.js"></script>
</body>
</html>
